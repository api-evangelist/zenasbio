name: Zenasbio
description: 'Zenas BioPharma is a global clinical-stage biopharmaceutical company focused on developing
  and delivering transformative treatments for patients with autoimmune and rare diseases. Its lead
  candidates are obexelimab, a bifunctional monoclonal antibody that inhibits B-cell activity without
  depleting B cells, and orelabrutinib, an oral central-nervous-system-penetrant BTK inhibitor. The
  company serves patients, caregivers, investors, and job seekers through its corporate website; it
  publishes no public developer portal, API, SDKs, or technical integration surface. This profile was
  surfaced as a portfolio company of Norwest Venture Partners.'
